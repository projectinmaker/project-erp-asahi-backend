version: '3.8'

services:
  # ============================================
  # PostgreSQL Database - Local Development
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: asahi-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asahi_dev
      POSTGRES_PASSWORD: asahi_dev_123
      POSTGRES_DB: asahi_erp_dev
    ports:
      - '5432:5432'
    volumes:
      - asahi_pgdata:/var/lib/postgresql/data
      # Optional: init script untuk auto-create extensions
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U asahi_dev -d asahi_erp_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # pgAdmin - Database GUI (opsional tapi helpful)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: asahi-erp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: adm.masdigital@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Adminmasdigital12345
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '5050:80'
    volumes:
      - asahi_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  asahi_pgdata:
    driver: local
  asahi_pgadmin_data:
    driver: local
